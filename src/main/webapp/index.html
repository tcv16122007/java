<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog SE - Trang chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-pencil-square"></i> Blog SE</a>
            <div class="d-flex align-items-center">
                <img id="avatarImg" src="https://ui-avatars.com/api/?name=User&background=667eea&color=fff&size=32"
                    class="rounded-circle me-2" style="width:32px;height:32px;object-fit:cover;display:none;">
                <span id="userInfo" class="text-white me-2 d-none"></span>
                <button class="btn btn-outline-light btn-sm me-2" onclick="toggleTheme()"><i
                        class="bi bi-moon-stars"></i></button>
                <a href="#" id="loginBtn" class="btn btn-outline-light me-2"
                    onclick="window.location.href='login.html'">Đăng nhập</a>
                <a href="#" id="registerBtn" class="btn btn-outline-light me-2"
                    onclick="window.location.href='register.html'">Đăng ký</a>
                <a href="#" id="logoutBtn" class="btn btn-danger d-none" onclick="logout()">Đăng xuất</a>
                <a href="dashboard.html" id="dashboardBtn" class="btn btn-light ms-2 d-none">Dashboard</a>
                <a href="#" id="bookmarkBtn" class="btn btn-outline-light ms-2 d-none" onclick="loadBookmarks()"><i
                        class="bi bi-bookmark"></i> Bài đã lưu</a>
                <a href="#" id="supportBtn" class="btn btn-outline-light ms-2 d-none" data-bs-toggle="modal"
                    data-bs-target="#supportModal"><i class="bi bi-headset"></i> Hỗ trợ</a>
            </div>
        </div>
    </nav>

    <!-- Modal Hỗ trợ -->
    <div class="modal fade" id="supportModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">💬 Hỗ trợ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="supportForm">
                        <div class="mb-3">
                            <label class="form-label">Nội dung</label>
                            <textarea id="supportMessage" class="form-control" rows="4" placeholder="Nhập tin nhắn..."
                                required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Gửi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Hero -->
    <section class="hero text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">📘 Blog Software Engineering</h1>
            <p class="lead">Chia sẻ kiến thức về Kỹ thuật phần mềm</p>
        </div>
    </section>

    <!-- Bộ lọc -->
    <div class="container mt-3">
        <div class="filter-section row g-2">
            <div class="col-md-3">
                <select id="filterCategory" class="form-select" onchange="loadPosts(1)">
                    <option value="">📂 Tất cả danh mục</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="filterTag" class="form-select" onchange="loadPosts(1)">
                    <option value="">🏷️ Tất cả thẻ</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="filterSort" class="form-select" onchange="loadPosts(1)">
                    <option value="newest">🕐 Mới nhất</option>
                    <option value="most_viewed">👁️ Lượt xem</option>
                    <option value="most_liked">❤️ Lượt thích</option>
                    <option value="most_commented">💬 Bình luận</option>
                </select>
            </div>
            <div class="col-md-3">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Tìm kiếm..."
                        onkeyup="if(event.key==='Enter') loadPosts(1)">
                    <button class="btn btn-primary" onclick="loadPosts(1)"><i class="bi bi-search"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Danh sách bài viết -->
    <div class="container mt-4">
        <div id="postList" class="row g-4">
            <div class="col-12 text-center text-muted">Đang tải bài viết...</div>
        </div>
        <!-- Phân trang -->
        <div id="paginationContainer" class="d-flex justify-content-center mt-4"></div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <small>&copy; 2027 Blog SE - Software Engineering - Nhóm 2</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentUser = null;
        let currentPage = 1;
        const limit = 9;

        async function checkLogin() {
            try {
                const res = await callApi('GET', '/current-user');
                if (res.success) {
                    currentUser = res.user;
                    updateUI(currentUser);
                } else {
                    updateUI(null);
                }
            } catch (e) { updateUI(null); }
        }

        async function loadPosts(page = 1) {
            currentPage = page;
            const keyword = document.getElementById('searchInput').value.trim();
            const categoryId = document.getElementById('filterCategory').value;
            const tagId = document.getElementById('filterTag').value;
            const sort = document.getElementById('filterSort').value;

            let url = '/posts?action=filter&page=' + page + '&limit=' + limit;
            if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
            if (categoryId) url += '&categoryId=' + categoryId;
            if (tagId) url += '&tagId=' + tagId;
            if (sort) url += '&sort=' + sort;

            try {
                const result = await callApi('GET', url);
                const posts = result.posts || [];
                const total = result.total || 0;
                const totalPages = result.totalPages || 1;

                const container = document.getElementById('postList');
                if (posts.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center text-muted">Chưa có bài viết nào.</div>';
                } else {
                    container.innerHTML = posts.map(p => `
                        <div class="col-md-4">
                            <a href="post-detail.html?id=${p.postId}" class="text-decoration-none text-dark">
                                <div class="card h-100">
                                    <div class="card-body">
                                        <span class="badge bg-primary badge-custom">${p.categoryName || 'Chung'}</span>
                                        <h5 class="card-title mt-2">${p.title}</h5>
                                        <p class="card-text text-muted small">${p.summary || ''}</p>
                                        <div class="d-flex justify-content-between align-items-center mt-3">
                                            <div class="post-meta">
                                                <span class="me-2">❤️ ${p.likeCount || 0}</span>
                                                <span>💬 ${p.commentCount || 0}</span>
                                                <span class="ms-2"><i class="bi bi-eye"></i> ${p.viewCount || 0}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card-footer bg-transparent text-muted small">
                                        <i class="bi bi-person"></i> ${p.authorName} | ${formatDate(p.createdAt)}
                                    </div>
                                </div>
                            </a>
                        </div>
                    `).join('');
                }

                const pagination = document.getElementById('paginationContainer');
                if (totalPages > 1) {
                    let html = '<ul class="pagination">';
                    html += `<li class="page-item ${page <= 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="loadPosts(${page - 1}); return false;">«</a></li>`;
                    for (let i = 1; i <= totalPages; i++) {
                        html += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" href="#" onclick="loadPosts(${i}); return false;">${i}</a></li>`;
                    }
                    html += `<li class="page-item ${page >= totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="loadPosts(${page + 1}); return false;">»</a></li>`;
                    html += '</ul>';
                    pagination.innerHTML = html;
                } else {
                    pagination.innerHTML = '';
                }
            } catch (err) {
                document.getElementById('postList').innerHTML = '<div class="col-12 text-center text-danger">Lỗi tải dữ liệu</div>';
            }
        }

        async function loadBookmarks() {
            const posts = await callApi('GET', '/bookmarks?action=list');
            const container = document.getElementById('postList');
            document.getElementById('paginationContainer').innerHTML = '';
            if (!posts || posts.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted">Chưa có bài viết nào được lưu.</div>';
            } else {
                container.innerHTML = posts.map(p => `
                    <div class="col-md-4">
                        <a href="post-detail.html?id=${p.postId}" class="text-decoration-none text-dark">
                            <div class="card h-100">
                                <div class="card-body">
                                    <span class="badge bg-primary badge-custom">${p.categoryName || 'Chung'}</span>
                                    <h5 class="card-title mt-2">${p.title}</h5>
                                    <p class="card-text text-muted small">${p.summary || ''}</p>
                                    <div class="d-flex justify-content-between align-items-center mt-3">
                                        <div class="post-meta">
                                            <span class="me-2">❤️ ${p.likeCount || 0}</span>
                                            <span>💬 ${p.commentCount || 0}</span>
                                            <span class="ms-2"><i class="bi bi-eye"></i> ${p.viewCount || 0}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer bg-transparent text-muted small">
                                    <i class="bi bi-person"></i> ${p.authorName} | ${formatDate(p.createdAt)}
                                </div>
                            </div>
                        </a>
                    </div>
                `).join('');
            }
        }

        async function loadFilters() {
            try {
                const cats = await callApi('GET', '/categories');
                const catSel = document.getElementById('filterCategory');
                if (cats) cats.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.categoryId;
                    opt.textContent = c.categoryName;
                    catSel.appendChild(opt);
                });
                const tags = await callApi('GET', '/tags');
                const tagSel = document.getElementById('filterTag');
                if (tags) tags.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.tagId;
                    opt.textContent = '#' + t.tagName;
                    tagSel.appendChild(opt);
                });
            } catch (e) { console.warn('Filter load error', e); }
        }

        // ---- Hỗ trợ ----
        document.getElementById('supportForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const message = document.getElementById('supportMessage').value.trim();
            if (!message) {
                showToast('Vui lòng nhập nội dung', 'danger');
                return;
            }
            try {
                const result = await callApi('POST', '/support', { message });
                if (result.success) {
                    showToast('Đã gửi tin nhắn hỗ trợ', 'success');
                    document.getElementById('supportMessage').value = '';
                    bootstrap.Modal.getInstance(document.getElementById('supportModal')).hide();
                } else {
                    showToast(result.message || 'Lỗi gửi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        });

        async function logout() {
            await callApi('POST', '/logout');
            currentUser = null;
            updateUI(null);
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadTheme();
            applyGlobalSettings();
            checkLogin();
            loadFilters();
            loadPosts(1);
        });
    </script>
</body>

</html>
