<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Blog SE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container d-flex align-items-center min-vh-100">
        <div class="login-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold">🔄 Đặt lại mật khẩu</h3>
                <p class="text-muted">Nhập mật khẩu mới của bạn</p>
            </div>

            <form id="resetForm">
                <input type="hidden" id="token" value="">
                <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu mới</label>
                    <input type="password" id="newPassword" class="form-control form-control-lg" placeholder="••••••••"
                        required minlength="4">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" class="form-control form-control-lg"
                        placeholder="••••••••" required>
                </div>

                <div id="resetMessage" class="alert d-none"></div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">Đặt lại mật khẩu</button>
            </form>

            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại đăng
                    nhập</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Lấy token từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            document.getElementById('token').value = token;
        } else {
            document.getElementById('resetMessage').className = 'alert alert-danger';
            document.getElementById('resetMessage').textContent = 'Token không hợp lệ hoặc đã hết hạn!';
            document.getElementById('resetMessage').classList.remove('d-none');
            document.querySelector('button[type="submit"]').disabled = true;
        }

        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgDiv = document.getElementById('resetMessage');

            if (newPassword.length < 4) {
                msgDiv.className = 'alert alert-danger';
                msgDiv.textContent = 'Mật khẩu phải có ít nhất 4 ký tự!';
                msgDiv.classList.remove('d-none');
                return;
            }
            if (newPassword !== confirmPassword) {
                msgDiv.className = 'alert alert-danger';
                msgDiv.textContent = 'Mật khẩu xác nhận không khớp!';
                msgDiv.classList.remove('d-none');
                return;
            }

            try {
                const res = await fetch('api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'token=' + encodeURIComponent(token) + '&newPassword=' + encodeURIComponent(newPassword)
                });
                const data = await res.json();
                msgDiv.className = data.success ? 'alert alert-success' : 'alert alert-danger';
                msgDiv.textContent = data.message;
                msgDiv.classList.remove('d-none');

                if (data.success) {
                    setTimeout(() => window.location.href = 'login.html', 3000);
                }
            } catch (err) {
                msgDiv.className = 'alert alert-danger';
                msgDiv.textContent = 'Lỗi kết nối server!';
                msgDiv.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
