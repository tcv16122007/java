<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Blog SE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container d-flex align-items-center min-vh-100">
        <div class="login-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold">🔄 Đặt lại mật khẩu</h3>
                <p class="text-muted">Nhập mật khẩu mới cho tài khoản của bạn</p>
            </div>

            <form id="resetForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu mới</label>
                    <input type="password" id="newPassword" class="form-control form-control-lg"
                        placeholder="Ít nhất 4 ký tự" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" class="form-control form-control-lg"
                        placeholder="Nhập lại mật khẩu" required>
                </div>

                <div id="resetError" class="alert alert-danger d-none"></div>
                <div id="resetSuccess" class="alert alert-success d-none"></div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">Đặt lại mật khẩu</button>
            </form>

            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none"><i class="bi bi-box-arrow-in-right"></i> Quay lại đăng
                    nhập</a>
            </div>
            <div class="text-center mt-2">
                <a href="index.html" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Quay về trang chủ</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('resetError').innerText = 'Token không hợp lệ. Vui lòng thử lại.';
            document.getElementById('resetError').classList.remove('d-none');
            document.getElementById('resetForm').querySelector('button').disabled = true;
        }

        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirm = document.getElementById('confirmPassword').value.trim();
            const errorDiv = document.getElementById('resetError');
            const successDiv = document.getElementById('resetSuccess');

            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');

            if (newPassword.length < 4) {
                errorDiv.innerText = 'Mật khẩu phải có ít nhất 4 ký tự';
                errorDiv.classList.remove('d-none');
                return;
            }
            if (newPassword !== confirm) {
                errorDiv.innerText = 'Mật khẩu xác nhận không khớp';
                errorDiv.classList.remove('d-none');
                return;
            }

            try {
                const res = await fetch('/java/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ token, newPassword })
                });
                const data = await res.json();
                if (data.success) {
                    successDiv.innerText = '✅ Đặt lại mật khẩu thành công! Chuyển đến trang đăng nhập...';
                    successDiv.classList.remove('d-none');
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    errorDiv.innerText = data.message || 'Đặt lại mật khẩu thất bại';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                errorDiv.innerText = 'Lỗi kết nối server!';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
