<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Đặt lại mật khẩu - Blog SE
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/app.css?v=20260806" rel="stylesheet" />
    <link href="css/pages/auth.css?v=20260806" rel="stylesheet" />
</head>

<body class="auth-page">
    <main class="auth-shell">
        <a class="auth-brand" href="index.html">
            <i class="bi bi-pencil-square">
            </i>
            Blog SE
        </a>
        <section class="auth-card app-card">
            <div class="auth-icon">
                <i class="bi bi-key">
                </i>
            </div>
            <h1 class="h3 fw-bold text-center">
                Đặt lại mật khẩu
            </h1>
            <p class="text-muted text-center" id="tokenStatus">
                Đang kiểm tra liên kết...
            </p>
            <div class="alert d-none" id="formMessage">
            </div>
            <form class="d-none" id="resetForm" novalidate="">
                <label class="form-label" for="newPassword">
                    Mật khẩu mới
                </label>
                <div class="input-group mb-2">
                    <input autocomplete="new-password" class="form-control" id="newPassword" maxlength="72"
                        minlength="8" required="" type="password" />
                    <button class="btn btn-outline-secondary" data-password-toggle="newPassword" type="button">
                        <i class="bi bi-eye">
                        </i>
                    </button>
                </div>
                <div class="password-strength mb-1">
                    <span id="strengthBar">
                    </span>
                </div>
                <small class="text-muted" id="strengthText">
                    Từ 8–72 ký tự.
                </small>
                <label class="form-label mt-3" for="confirmPassword">
                    Nhập lại mật khẩu
                </label>
                <div class="input-group mb-3">
                    <input autocomplete="new-password" class="form-control" id="confirmPassword" maxlength="72"
                        minlength="8" required="" type="password" />
                    <button class="btn btn-outline-secondary" data-password-toggle="confirmPassword" type="button">
                        <i class="bi bi-eye">
                        </i>
                    </button>
                </div>
                <button class="btn btn-gradient w-100" type="submit">
                    Đổi mật khẩu
                </button>
            </form>
            <p class="text-center mt-4 mb-0">
                <a href="login.html">
                    <i class="bi bi-arrow-left">
                    </i>
                    Quay lại đăng nhập
                </a>
            </p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/app.js?v=20260816-account-status">
    </script>
    <script src="js/reset-password.js?v=20260806">
    </script>
</body>

</html>
