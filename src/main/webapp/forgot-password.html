<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Blog SE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container d-flex align-items-center min-vh-100">
        <div class="login-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold">🔑 Quên mật khẩu</h3>
                <p class="text-muted">Nhập tên đăng nhập và email để đặt lại mật khẩu</p>
            </div>

            <form id="forgotForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control form-control-lg" placeholder="Tên đăng nhập"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" id="email" class="form-control form-control-lg" placeholder="email@example.com"
                        required>
                </div>

                <div id="forgotError" class="alert alert-danger d-none"></div>
                <div id="forgotSuccess" class="alert alert-success d-none"></div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">Xác nhận</button>
            </form>

            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none"><i class="bi bi-box-arrow-in-right"></i> Quay lại đăng
                    nhập</a>
            </div>
            <div class="text-center mt-2">
                <a href="index.html" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Quay về trang chủ</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const errorDiv = document.getElementById('forgotError');
            const successDiv = document.getElementById('forgotSuccess');

            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');

            if (username.length < 2 || !email) {
                errorDiv.innerText = 'Vui lòng nhập đầy đủ thông tin';
                errorDiv.classList.remove('d-none');
                return;
            }

            try {
                const res = await fetch('/java/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username, email })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = 'reset-password.html?token=' + data.token;
                } else {
                    errorDiv.innerText = data.message || 'Xác thực thất bại';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                errorDiv.innerText = 'Lỗi kết nối server!';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
