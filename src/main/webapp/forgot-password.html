<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Quên mật khẩu - Blog SE
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/app.css?v=20260806" rel="stylesheet" />
    <link href="css/pages/auth.css?v=20260806" rel="stylesheet" />
</head>

<body class="auth-page">
    <main class="auth-shell">
        <a class="auth-brand" href="index.html">
            <i class="bi bi-pencil-square">
            </i>
            Blog SE
        </a>
        <section class="auth-card app-card">
            <div class="auth-icon">
                <i class="bi bi-envelope-lock">
                </i>
            </div>
            <h1 class="h3 fw-bold text-center">
                Khôi phục mật khẩu
            </h1>
            <p class="text-muted text-center">
                Nhập đúng tên đăng nhập và email. Liên kết đặt lại có hiệu lực trong 30 phút.
            </p>
            <div class="alert d-none" id="formMessage">
            </div>
            <form id="forgotForm" novalidate="">
                <label class="form-label" for="username">
                    Tên đăng nhập
                </label>
                <input autocomplete="username" class="form-control mb-3" id="username" maxlength="50" required=""
                    type="text" />
                <label class="form-label" for="email">
                    Email
                </label>
                <input autocomplete="email" class="form-control mb-3" id="email" maxlength="100" required=""
                    type="email" />
                <button class="btn btn-gradient w-100" type="submit">
                    Gửi liên kết
                </button>
            </form>
            <div class="dev-reset-panel d-none mt-3" id="devResetPanel">
                <strong>
                    Chế độ phát triển:
                </strong>
                <p class="small mb-2">
                    SMTP chưa được cấu hình. Dùng liên kết thử nghiệm bên dưới.
                </p>
                <a class="btn btn-sm btn-outline-primary" href="#" id="devResetLink">
                    Mở trang đặt lại
                </a>
            </div>
            <p class="text-center mt-4 mb-0">
                <a href="login.html">
                    <i class="bi bi-arrow-left">
                    </i>
                    Quay lại đăng nhập
                </a>
            </p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/app.js?v=20260816-account-status">
    </script>
    <script src="js/forgot-password.js?v=20260806">
    </script>
</body>

</html>
