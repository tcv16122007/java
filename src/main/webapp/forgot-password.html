<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Blog SE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container d-flex align-items-center min-vh-100">
        <div class="login-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold">🔑 Quên mật khẩu</h3>
                <p class="text-muted">Nhập email của bạn để nhận link đặt lại mật khẩu</p>
            </div>

            <form id="forgotForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" id="email" class="form-control form-control-lg" placeholder="email@example.com"
                        required>
                </div>

                <div id="forgotMessage" class="alert d-none"></div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">Gửi yêu cầu</button>
            </form>

            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại đăng
                    nhập</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const msgDiv = document.getElementById('forgotMessage');

            if (!email || !email.includes('@')) {
                msgDiv.className = 'alert alert-danger';
                msgDiv.textContent = 'Vui lòng nhập email hợp lệ!';
                msgDiv.classList.remove('d-none');
                return;
            }

            try {
                const res = await fetch('api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'email=' + encodeURIComponent(email)
                });
                const data = await res.json();
                msgDiv.className = data.success ? 'alert alert-success' : 'alert alert-danger';
                msgDiv.textContent = data.message;
                msgDiv.classList.remove('d-none');

                if (data.success) {
                    // Có thể chuyển hướng về login sau vài giây
                    setTimeout(() => window.location.href = 'login.html', 3000);
                }
            } catch (err) {
                msgDiv.className = 'alert alert-danger';
                msgDiv.textContent = 'Lỗi kết nối server!';
                msgDiv.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
