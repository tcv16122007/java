<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Blog SE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/app.css?v=20260806">
    <link rel="stylesheet" href="css/pages/auth.css?v=20260806">
</head>

<body class="auth-page">
    <main class="auth-shell">
        <a class="auth-brand" href="index.html"><i class="bi bi-pencil-square"></i> Blog SE</a>
        <section class="auth-card app-card">
            <div class="auth-icon"><i class="bi bi-box-arrow-in-right"></i></div>
            <h1 class="h3 fw-bold text-center">Chào mừng trở lại</h1>
            <p class="text-muted text-center">Đăng nhập để viết bài, bình luận và lưu nội dung yêu thích.</p>
            <div id="formMessage" class="alert d-none" role="alert"></div>
            <form id="loginForm" autocomplete="on" novalidate>
                <label class="form-label" for="username">Tên đăng nhập</label>
                <input id="username" name="username" class="form-control mb-3" type="text" minlength="3" maxlength="50"
                    autocomplete="username" required autofocus>
                <label class="form-label" for="password">Mật khẩu</label>
                <div class="input-group mb-2"><input id="password" name="password" class="form-control" type="password"
                        maxlength="72" autocomplete="current-password" required><button
                        class="btn btn-outline-secondary" type="button" data-password-toggle="password"
                        aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button></div>
                <div class="d-flex justify-content-end mb-3"><a href="forgot-password.html">Quên mật khẩu?</a></div>
                <button class="btn btn-gradient w-100" type="submit">Đăng nhập</button>
            </form>
            <p class="text-center mt-4 mb-0">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=20260816-account-status"></script>
    <script src="js/login.js?v=20260807-2208"></script>
</body>

</html>
