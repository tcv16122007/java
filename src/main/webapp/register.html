<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Blog SE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container d-flex align-items-center min-vh-100">
        <div class="login-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold">📝 Đăng ký tài khoản</h3>
                <p class="text-muted">Tạo tài khoản để tham gia cộng đồng</p>
            </div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Họ và tên</label>
                    <input type="text" id="fullName" class="form-control form-control-lg" placeholder="Nguyễn Văn A"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control form-control-lg" placeholder="username"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" id="email" class="form-control form-control-lg" placeholder="email@example.com"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <input type="password" id="password" class="form-control form-control-lg"
                        placeholder="Ít nhất 4 ký tự" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" class="form-control form-control-lg"
                        placeholder="Nhập lại mật khẩu" required>
                </div>

                <div id="registerError" class="alert alert-danger d-none"></div>
                <div id="registerSuccess" class="alert alert-success d-none"></div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">Đăng ký</button>
            </form>

            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none"><i class="bi bi-box-arrow-in-right"></i> Đã có tài
                    khoản? Đăng nhập</a>
            </div>
            <div class="text-center mt-2">
                <a href="index.html" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Quay về trang chủ</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirm = document.getElementById('confirmPassword').value.trim();
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');

            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');

            if (fullName.length < 2) {
                errorDiv.innerText = 'Họ tên phải có ít nhất 2 ký tự';
                errorDiv.classList.remove('d-none');
                return;
            }
            if (username.length < 3) {
                errorDiv.innerText = 'Tên đăng nhập phải có ít nhất 3 ký tự';
                errorDiv.classList.remove('d-none');
                return;
            }
            if (!email || !email.includes('@')) {
                errorDiv.innerText = 'Email không hợp lệ';
                errorDiv.classList.remove('d-none');
                return;
            }
            if (password.length < 4) {
                errorDiv.innerText = 'Mật khẩu phải có ít nhất 4 ký tự';
                errorDiv.classList.remove('d-none');
                return;
            }
            if (password !== confirm) {
                errorDiv.innerText = 'Mật khẩu xác nhận không khớp';
                errorDiv.classList.remove('d-none');
                return;
            }

            try {
                const res = await fetch('/java/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ fullName, username, email, password })
                });
                const data = await res.json();
                if (data.success) {
                    successDiv.innerText = '✅ Đăng ký thành công! Vui lòng đăng nhập.';
                    successDiv.classList.remove('d-none');
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    errorDiv.innerText = data.message || 'Đăng ký thất bại';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                errorDiv.innerText = 'Lỗi kết nối server!';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
