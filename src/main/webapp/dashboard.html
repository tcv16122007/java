<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Blog SE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-pencil-square"></i> Blog SE</a>
            <div class="d-flex align-items-center">
                <img id="avatarImg" src="https://ui-avatars.com/api/?name=User&background=667eea&color=fff&size=32"
                    class="rounded-circle me-2" style="width:32px;height:32px;object-fit:cover;display:none;">
                <span id="userInfo" class="text-white me-2 d-none"></span>
                <button class="btn btn-outline-light btn-sm me-2" onclick="toggleTheme()"><i
                        class="bi bi-moon-stars"></i></button>
                <a href="#" id="logoutBtn" class="btn btn-danger btn-sm me-2 d-none" onclick="logout()">Đăng xuất</a>
                <a href="index.html" class="btn btn-outline-light btn-sm">Trang chủ</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block sidebar p-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="loadSection('posts')"><i
                                class="bi bi-file-text"></i> Bài viết</a>
                    </li>
                    <!-- User-only menu -->
                    <li class="nav-item" id="writeMenu" style="display:none;">
                        <a class="nav-link" href="#" onclick="loadSection('write')"><i class="bi bi-pencil"></i> Viết
                            bài</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadSection('categories')"><i class="bi bi-tags"></i> Danh
                            mục</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadSection('comments')"><i class="bi bi-chat"></i> Bình
                            luận</a>
                    </li>
                    <li class="nav-item" id="modMenu" style="display:none;">
                        <a class="nav-link" href="#" onclick="loadSection('moderation')"><i
                                class="bi bi-check-circle"></i> Duyệt bài</a>
                    </li>
                    <li class="nav-item" id="adminMenu" style="display:none;">
                        <a class="nav-link" href="#" onclick="loadSection('users')"><i class="bi bi-people"></i> Người
                            dùng</a>
                    </li>
                    <!-- User-only: bookmark & history -->
                    <li class="nav-item" id="bookmarkMenu" style="display:none;">
                        <a class="nav-link" href="#" onclick="loadSection('bookmarks')"><i class="bi bi-bookmark"></i>
                            Bài viết đã lưu</a>
                    </li>
                    <li class="nav-item" id="historyPostsMenu" style="display:none;">
                        <a class="nav-link" href="#" onclick="loadSection('history-posts')"><i
                                class="bi bi-clock-history"></i> Lịch sử bài viết</a>
                    </li>
                    <!-- Mod/Admin only: interaction history -->
                    <li class="nav-item" id="historyInteractionsMenu" style="display:none;">
                        <a class="nav-link" href="#" onclick="loadSection('history-interactions')"><i
                                class="bi bi-activity"></i> Lịch sử tương tác</a>
                    </li>
                    <li class="nav-item" id="reportMenu" style="display:none;">
                        <a class="nav-link" href="#" onclick="loadSection('reports')"><i class="bi bi-flag"></i> Báo
                            cáo</a>
                    </li>
                    <!-- Support for User -->
                    <li class="nav-item" id="supportMenu" style="display:none;">
                        <a class="nav-link" href="#" onclick="loadSection('support')"><i class="bi bi-headset"></i> Hỗ
                            trợ</a>
                    </li>
                    <!-- Support messages for Admin/Mod -->
                    <li class="nav-item" id="supportMessagesMenu" style="display:none;">
                        <a class="nav-link" href="#" onclick="loadSection('support-messages')"><i
                                class="bi bi-envelope"></i> Hỗ trợ người dùng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html"><i class="bi bi-person-gear"></i> Cá nhân</a>
                    </li>
                </ul>
            </nav>

            <!-- Content -->
            <main class="col-md-10 p-4">
                <div id="dashContent">
                    <h4><i class="bi bi-file-text"></i> Quản lý bài viết</h4>
                    <div id="postsContainer"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentUser = null;

        async function checkLogin() {
            const res = await callApi('GET', '/current-user');
            if (res.success) {
                currentUser = res.user;
                updateUI(currentUser);
                // Menu permissions
                document.getElementById('writeMenu').style.display = currentUser.role === 'USER' ? 'block' : 'none';
                document.getElementById('modMenu').style.display = (currentUser.role === 'MODERATOR' || currentUser.role === 'ADMIN') ? 'block' : 'none';
                document.getElementById('adminMenu').style.display = currentUser.role === 'ADMIN' ? 'block' : 'none';
                // Bookmark & History chỉ dành cho User
                document.getElementById('bookmarkMenu').style.display = currentUser.role === 'USER' ? 'block' : 'none';
                document.getElementById('historyPostsMenu').style.display = currentUser.role === 'USER' ? 'block' : 'none';
                // History interactions chỉ dành cho Mod/Admin
                document.getElementById('historyInteractionsMenu').style.display = (currentUser.role === 'MODERATOR' || currentUser.role === 'ADMIN') ? 'block' : 'none';
                document.getElementById('reportMenu').style.display = (currentUser.role === 'MODERATOR' || currentUser.role === 'ADMIN') ? 'block' : 'none';
                // Support
                document.getElementById('supportMenu').style.display = currentUser.role === 'USER' ? 'block' : 'none';
                document.getElementById('supportMessagesMenu').style.display = (currentUser.role === 'MODERATOR' || currentUser.role === 'ADMIN') ? 'block' : 'none';

                loadSection('posts');
            } else {
                window.location.href = 'login.html';
            }
        }

        async function loadSection(section) {
            const content = document.getElementById('dashContent');
            switch (section) {
                case 'posts':
                    content.innerHTML = `
                        <h4><i class="bi bi-file-text"></i> Quản lý bài viết</h4>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead><tr><th>STT</th><th>Tiêu đề</th><th>Trạng thái</th><th>Ngày tạo</th><th>Hành động</th></tr></thead>
                                <tbody id="myPostsBody"><tr><td colspan="5" class="text-center text-muted">Đang tải...</td></tr></tbody>
                            </table>
                        </div>`;
                    await loadMyPosts();
                    break;
                case 'write':
                    content.innerHTML = `
                        <h4><i class="bi bi-pencil"></i> Viết bài mới</h4>
                        <div class="card p-3">
                            <form id="writeForm">
                                <div class="mb-2"><input type="text" id="postTitle" class="form-control" placeholder="Tiêu đề" required></div>
                                <div class="mb-2"><input type="text" id="postSummary" class="form-control" placeholder="Tóm tắt"></div>
                                <div class="mb-2"><select id="postCategory" class="form-select"></select></div>
                                <div class="mb-2"><textarea id="postContent" class="form-control" rows="6" placeholder="Nội dung..."></textarea></div>
                                <button type="submit" class="btn btn-primary">Đăng bài</button>
                            </form>
                        </div>`;
                    await loadCategoryOptions();
                    document.getElementById('writeForm').addEventListener('submit', submitPost);
                    break;
                case 'categories':
                    content.innerHTML = `
                        <h4><i class="bi bi-tags"></i> Danh mục</h4>
                        <div class="mb-2" id="categoryAddArea">
                            <form id="addCategoryForm" class="d-flex gap-2">
                                <input type="text" id="newCategoryName" class="form-control" placeholder="Tên danh mục" required>
                                <input type="text" id="newCategoryDesc" class="form-control" placeholder="Mô tả">
                                <button type="submit" class="btn btn-primary">Thêm</button>
                            </form>
                        </div>
                        <div id="categoryList" class="table-responsive"></div>`;
                    await loadCategories();
                    document.getElementById('addCategoryForm').addEventListener('submit', addCategory);
                    break;
                case 'comments':
                    content.innerHTML = `
                        <h4><i class="bi bi-chat"></i> Quản lý bình luận</h4>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead><tr><th>STT</th><th>Nội dung</th><th>Bài viết</th><th>Người dùng</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
                                <tbody id="commentListBody"><tr><td colspan="6" class="text-center text-muted">Đang tải...</td></tr></tbody>
                            </table>
                        </div>`;
                    await loadAllComments();
                    break;
                case 'moderation':
                    content.innerHTML = `
                        <h4><i class="bi bi-check-circle"></i> Duyệt bài</h4>
                        <div id="pendingPosts"></div>`;
                    await loadPendingPosts();
                    break;
                case 'users':
                    content.innerHTML = `
                        <h4><i class="bi bi-people"></i> Quản lý người dùng</h4>
                        <div class="input-group mb-2" style="max-width:300px;">
                            <input type="text" id="searchUserInput" class="form-control" placeholder="Tìm user..." onkeyup="loadUsers()">
                            <button class="btn btn-outline-secondary" onclick="document.getElementById('searchUserInput').value=''; loadUsers()">✕</button>
                        </div>
                        <div id="userList" class="table-responsive"></div>`;
                    await loadUsers();
                    break;
                case 'bookmarks':
                    content.innerHTML = `
                        <h4><i class="bi bi-bookmark"></i> Bài viết đã lưu</h4>
                        <div id="bookmarkList" class="row g-4"></div>`;
                    await loadBookmarks();
                    break;
                case 'history-posts':
                    content.innerHTML = `
                        <h4><i class="bi bi-clock-history"></i> Lịch sử bài viết</h4>
                        <div id="historyPostList" class="table-responsive"></div>`;
                    await loadHistoryPosts();
                    break;
                case 'history-interactions':
                    content.innerHTML = `
                        <h4><i class="bi bi-activity"></i> Lịch sử tương tác</h4>
                        <div class="mb-2">
                            <label>Chọn user:</label>
                            <select id="interactionUserSelect" class="form-select" style="max-width:300px;" onchange="loadHistoryInteractions()"></select>
                        </div>
                        <div id="historyInteractionList" class="table-responsive"></div>`;
                    await loadUsersForInteractionSelect();
                    break;
                case 'reports':
                    content.innerHTML = `
                        <h4><i class="bi bi-flag"></i> Quản lý báo cáo</h4>
                        <div id="reportList" class="table-responsive"></div>`;
                    await loadReports();
                    break;
                // === SUPPORT (User) ===
                case 'support':
                    content.innerHTML = `
                        <h4><i class="bi bi-headset"></i> Hỗ trợ</h4>
                        <div class="card p-4">
                            <p class="text-muted">Gửi tin nhắn đến Quản trị viên / Kiểm duyệt viên để được hỗ trợ.</p>
                            <form id="supportForm">
                                <div class="mb-3">
                                    <label class="form-label">Nội dung</label>
                                    <textarea id="supportMessage" class="form-control" rows="5" placeholder="Nhập tin nhắn của bạn..." required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Gửi</button>
                            </form>
                            <div id="supportStatus" class="mt-3"></div>
                        </div>`;
                    document.getElementById('supportForm').addEventListener('submit', submitSupport);
                    break;
                // === SUPPORT MESSAGES (Admin/Mod) ===
                case 'support-messages':
                    content.innerHTML = `
                        <h4><i class="bi bi-envelope"></i> Hỗ trợ người dùng</h4>
                        <div id="supportMessageList" class="table-responsive"></div>`;
                    await loadSupportMessages();
                    break;
            }
        }

        // ---- My Posts ----
        async function loadMyPosts() {
            try {
                const posts = await callApi('GET', '/posts?action=my');
                const tbody = document.getElementById('myPostsBody');
                if (!posts || posts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Chưa có bài viết</td></tr>';
                    return;
                }
                posts.sort((a, b) => a.postId - b.postId);
                tbody.innerHTML = posts.map((p, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${p.title}</td>
                        <td>${getStatusBadge(p.status)}</td>
                        <td>${formatDate(p.createdAt)}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deletePost(${p.postId})"><i class="bi bi-trash"></i></button>
                            ${p.status === 'REJECTED' ? `<button class="btn btn-sm btn-warning" onclick="resubmitPost(${p.postId})">Gửi lại</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Lỗi tải dữ liệu</td></tr>';
            }
        }

        async function deletePost(id) {
            if (!confirm('Xóa bài viết này?')) return;
            try {
                const result = await callApi('POST', '/posts', { action: 'delete', id });
                if (result.success) {
                    showToast('Đã xóa bài viết', 'success');
                    await loadMyPosts();
                } else {
                    showToast(result.message || result.error || 'Lỗi xóa bài', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        async function resubmitPost(id) {
            try {
                const result = await callApi('POST', '/posts', { action: 'resubmit', id });
                if (result.success) {
                    showToast('Đã gửi lại bài', 'success');
                    await loadMyPosts();
                } else {
                    showToast(result.message || result.error || 'Lỗi gửi lại', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        // ---- Write ----
        async function loadCategoryOptions() {
            const cats = await callApi('GET', '/categories');
            const sel = document.getElementById('postCategory');
            if (cats) sel.innerHTML = cats.map(c => `<option value="${c.categoryId}">${c.categoryName}</option>`).join('');
        }

        async function submitPost(e) {
            e.preventDefault();
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            if (!title || !content) {
                showToast('Vui lòng nhập đủ tiêu đề và nội dung', 'danger');
                return;
            }
            try {
                const data = {
                    action: 'add',
                    title,
                    content,
                    summary: document.getElementById('postSummary').value.trim(),
                    categoryId: document.getElementById('postCategory').value
                };
                const result = await callApi('POST', '/posts', data);
                if (result.success) {
                    showToast('✅ ' + result.message, 'success');
                    loadSection('posts');
                } else {
                    showToast('❌ ' + (result.message || result.error || 'Lỗi đăng bài'), 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        // ---- Categories ----
        async function loadCategories() {
            try {
                const cats = await callApi('GET', '/categories');
                const container = document.getElementById('categoryList');
                if (!cats || cats.length === 0) {
                    container.innerHTML = '<p class="text-muted">Chưa có danh mục</p>';
                    return;
                }
                const canEdit = currentUser && (currentUser.role === 'MODERATOR' || currentUser.role === 'ADMIN');
                container.innerHTML = `<table class="table"><thead><tr><th>Tên</th><th>Mô tả</th>${canEdit ? '<th>Hành động</th>' : ''}</tr></thead><tbody>
                    ${cats.map(c => `
                        <tr>
                            <td>${c.categoryName}</td>
                            <td>${c.description || ''}</td>
                            ${canEdit ? `
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick="editCategory(${c.categoryId}, '${c.categoryName}', '${c.description || ''}')"><i class="bi bi-pencil"></i></button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${c.categoryId})"><i class="bi bi-trash"></i></button>
                                </td>
                            ` : ''}
                        </tr>
                    `).join('')}
                </tbody></table>`;
            } catch (e) {
                document.getElementById('categoryList').innerHTML = '<p class="text-danger">Lỗi tải danh mục</p>';
            }
        }

        async function addCategory(e) {
            e.preventDefault();
            const name = document.getElementById('newCategoryName').value.trim();
            const desc = document.getElementById('newCategoryDesc').value.trim();
            if (!name) { showToast('Tên danh mục không được để trống', 'danger'); return; }
            try {
                const result = await callApi('POST', '/categories', { action: 'add', name, description: desc });
                if (result.success) {
                    showToast('Đã thêm danh mục', 'success');
                    document.getElementById('newCategoryName').value = '';
                    document.getElementById('newCategoryDesc').value = '';
                    loadCategories();
                } else {
                    showToast(result.message || result.error || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        function editCategory(id, name, desc) {
            const newName = prompt('Tên danh mục:', name);
            if (newName === null) return;
            const newDesc = prompt('Mô tả:', desc);
            if (newDesc === null) return;
            callApi('POST', '/categories', { action: 'update', id, name: newName.trim(), description: newDesc.trim() })
                .then(result => {
                    if (result.success) {
                        showToast('Đã cập nhật', 'success');
                        loadCategories();
                    } else {
                        showToast(result.message || result.error || 'Lỗi', 'danger');
                    }
                })
                .catch(e => {
                    showToast('Lỗi kết nối', 'danger');
                });
        }

        async function deleteCategory(id) {
            if (!confirm('Xóa danh mục này?')) return;
            try {
                const result = await callApi('POST', '/categories', { action: 'delete', id });
                if (result.success) {
                    showToast('Đã xóa danh mục', 'success');
                    loadCategories();
                } else {
                    showToast(result.message || result.error || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        // ---- All Comments (Admin/Mod) ----
        async function loadAllComments() {
            const tbody = document.getElementById('commentListBody');
            try {
                const comments = await callApi('GET', '/comments?action=all');
                if (!comments || comments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Chưa có bình luận</td></tr>';
                    return;
                }
                tbody.innerHTML = comments.map((c, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${c.content}</td>
                        <td>${c.postTitle || 'N/A'}</td>
                        <td>${c.username}</td>
                        <td>${getStatusBadge(c.status)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-warning" onclick="toggleCommentAdmin(${c.commentId})">
                                ${c.status === 'VISIBLE' ? 'Ẩn' : 'Hiện'}
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteCommentAdmin(${c.commentId})">Xóa</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Chưa có bình luận</td></tr>';
            }
        }

        async function toggleCommentAdmin(id) {
            try {
                const result = await callApi('POST', '/comments', { action: 'toggle', id });
                if (result.success) {
                    showToast('Đã cập nhật', 'success');
                    loadAllComments();
                } else {
                    showToast(result.message || result.error || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        async function deleteCommentAdmin(id) {
            if (!confirm('Xóa bình luận này?')) return;
            try {
                const result = await callApi('POST', '/comments', { action: 'delete', id });
                if (result.success) {
                    showToast('Đã xóa', 'success');
                    loadAllComments();
                } else {
                    showToast(result.message || result.error || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        // ---- Pending Posts (Moderator) ----
        async function loadPendingPosts() {
            const container = document.getElementById('pendingPosts');
            try {
                const posts = await callApi('GET', '/posts?action=pending');
                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p class="text-muted">Không có bài chờ duyệt</p>';
                    return;
                }
                container.innerHTML = posts.map(p => `
                    <div class="card p-3 mb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <div><strong>${p.title}</strong> ${getStatusBadge(p.status)}</div>
                            <div>
                                <button class="btn btn-sm btn-info" onclick="viewPostForModeration(${p.postId})"><i class="bi bi-eye"></i> Xem</button>
                                <button class="btn btn-sm btn-success" onclick="approvePost(${p.postId})"><i class="bi bi-check"></i> Duyệt</button>
                                <button class="btn btn-sm btn-danger" onclick="rejectPost(${p.postId})"><i class="bi bi-x"></i> Từ chối</button>
                            </div>
                        </div>
                        <small class="text-muted">${p.authorName}</small>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<p class="text-danger">Lỗi tải danh sách chờ duyệt: ${e.message}</p>`;
            }
        }

        function viewPostForModeration(postId) {
            const url = 'post-detail.html?id=' + postId + '&mod=1';
            window.open(url, '_blank');
        }

        async function approvePost(id) {
            try {
                const result = await callApi('POST', '/posts', { action: 'approve', id });
                if (result.success) {
                    showToast('✅ Đã duyệt bài', 'success');
                    try {
                        await loadPendingPosts();
                        await loadMyPosts();
                    } catch (e) { console.warn('Reload list error:', e); }
                } else {
                    const msg = result.message || result.error || 'Lỗi duyệt bài';
                    showToast('❌ ' + msg, 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối server', 'danger');
            }
        }

        async function rejectPost(id) {
            const reason = prompt('Lý do từ chối:');
            if (reason === null) return;
            try {
                const result = await callApi('POST', '/posts', { action: 'reject', id });
                if (result.success) {
                    showToast('⚠️ Đã từ chối bài', 'warning');
                    try {
                        await loadPendingPosts();
                        await loadMyPosts();
                    } catch (e) { console.warn('Reload list error:', e); }
                } else {
                    const msg = result.message || result.error || 'Lỗi từ chối bài';
                    showToast('❌ ' + msg, 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối server', 'danger');
            }
        }

        // ---- Users (Admin) ----
        async function loadUsers() {
            const keyword = document.getElementById('searchUserInput')?.value || '';
            const url = keyword ? `/users?action=search&keyword=${encodeURIComponent(keyword)}` : '/users?action=list';
            try {
                const users = await callApi('GET', url);
                const container = document.getElementById('userList');
                if (!users || users.length === 0) {
                    container.innerHTML = '<p class="text-muted">Không tìm thấy user</p>';
                    return;
                }
                container.innerHTML = `<table class="table"><thead><tr><th>Username</th><th>Họ tên</th><th>Quyền</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>
                    ${users.map(u => `
                        <tr>
                            <td>${u.username}</td>
                            <td>${u.fullName}</td>
                            <td>
                                <select class="form-select form-select-sm" style="width:120px;display:inline-block;" onchange="changeRole(${u.userId}, this.value)" ${u.userId === currentUser?.userId ? 'disabled' : ''}>
                                    <option value="USER" ${u.role === 'USER' ? 'selected' : ''}>User</option>
                                    <option value="MODERATOR" ${u.role === 'MODERATOR' ? 'selected' : ''}>Moderator</option>
                                    <option value="ADMIN" ${u.role === 'ADMIN' ? 'selected' : ''}>Admin</option>
                                </select>
                            </td>
                            <td>${getStatusBadge(u.status)}</td>
                            <td>
                                ${u.userId !== currentUser?.userId ? `
                                    <button class="btn btn-sm btn-${u.status === 'ACTIVE' ? 'danger' : 'success'}" onclick="toggleUser(${u.userId})">${u.status === 'ACTIVE' ? '🔒 Khóa' : '🔓 Mở'}</button>
                                ` : ''}
                            </td>
                        </tr>
                    `).join('')}
                </tbody></table>`;
            } catch (e) {
                document.getElementById('userList').innerHTML = '<p class="text-danger">Lỗi tải danh sách user</p>';
            }
        }

        async function toggleUser(id) {
            try {
                const user = await callApi('GET', `/users?action=detail&id=${id}`);
                if (user.error) return;
                const newStatus = user.status === 'ACTIVE' ? 'BLOCKED' : 'ACTIVE';
                const result = await callApi('POST', '/users', { action: 'block', id, status: newStatus });
                if (result.success) {
                    showToast(`Đã ${newStatus === 'ACTIVE' ? 'mở khóa' : 'khóa'}`, 'success');
                    loadUsers();
                } else {
                    showToast(result.message || result.error || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        async function changeRole(id, newRole) {
            if (!confirm('Đổi quyền người dùng này?')) return;
            try {
                const result = await callApi('POST', '/users', { action: 'changeRole', id, role: newRole });
                if (result.success) {
                    showToast(`Đã đổi thành ${newRole}`, 'info');
                    loadUsers();
                } else {
                    showToast(result.message || result.error || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        // ---- Bookmark ----
        async function loadBookmarks() {
            const container = document.getElementById('bookmarkList');
            try {
                const posts = await callApi('GET', '/bookmarks?action=list');
                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p class="text-muted">Chưa có bài viết nào được lưu.</p>';
                    return;
                }
                container.innerHTML = posts.map(p => `
                    <div class="col-md-4">
                        <a href="post-detail.html?id=${p.postId}" class="text-decoration-none text-dark">
                            <div class="card h-100">
                                <div class="card-body">
                                    <span class="badge bg-primary badge-custom">${p.categoryName || 'Chung'}</span>
                                    <h5 class="card-title mt-2">${p.title}</h5>
                                    <p class="card-text text-muted small">${p.summary || ''}</p>
                                    <div class="d-flex justify-content-between align-items-center mt-3">
                                        <div class="post-meta">
                                            <span class="me-2">❤️ ${p.likeCount || 0}</span>
                                            <span>💬 ${p.commentCount || 0}</span>
                                            <span class="ms-2"><i class="bi bi-eye"></i> ${p.viewCount || 0}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer bg-transparent text-muted small">
                                    <i class="bi bi-person"></i> ${p.authorName} | ${formatDate(p.createdAt)}
                                </div>
                            </div>
                        </a>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<p class="text-danger">Lỗi tải dữ liệu</p>';
            }
        }

        // ---- History Posts ----
        async function loadHistoryPosts() {
            const container = document.getElementById('historyPostList');
            try {
                const data = await callApi('GET', '/history/posts');
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-muted">Chưa có lịch sử xem bài viết.</p>';
                    return;
                }
                container.innerHTML = `<table class="table table-hover"><thead><tr><th>Tiêu đề</th><th>Ngày xem</th></tr></thead><tbody>
                    ${data.map(item => `<tr><td><a href="post-detail.html?id=${item.postId}">${item.title}</a></td><td>${formatDate(item.viewedAt)}</td></tr>`).join('')}
                </tbody></table>`;
            } catch (e) {
                container.innerHTML = '<p class="text-muted">Chưa có lịch sử xem bài viết.</p>';
            }
        }

        // ---- History Comments ----
        async function loadHistoryComments() {
            const container = document.getElementById('historyCommentList');
            try {
                const comments = await callApi('GET', '/history/comments');
                if (!comments || comments.length === 0) {
                    container.innerHTML = '<p class="text-muted">Chưa có bình luận nào.</p>';
                    return;
                }
                container.innerHTML = `<table class="table table-hover"><thead><tr><th>Bài viết</th><th>Nội dung</th><th>Ngày</th></tr></thead><tbody>
                    ${comments.map(c => `<tr><td><a href="post-detail.html?id=${c.postId}">${c.postTitle}</a></td><td>${c.content}</td><td>${formatDate(c.createdAt)}</td></tr>`).join('')}
                </tbody></table>`;
            } catch (e) {
                container.innerHTML = '<p class="text-muted">Chưa có bình luận nào.</p>';
            }
        }

        // ---- History Interactions ----
        async function loadUsersForInteractionSelect() {
            try {
                const users = await callApi('GET', '/users?action=list');
                const sel = document.getElementById('interactionUserSelect');
                if (users) {
                    sel.innerHTML = users.map(u => `<option value="${u.userId}">${u.username}</option>`).join('');
                    loadHistoryInteractions();
                }
            } catch (e) {
                console.error('loadUsersForInteractionSelect error:', e);
            }
        }

        async function loadHistoryInteractions() {
            const userId = document.getElementById('interactionUserSelect').value;
            if (!userId) return;
            const container = document.getElementById('historyInteractionList');
            try {
                const data = await callApi('GET', `/history/interactions?userId=${userId}`);
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-muted">Chưa có tương tác.</p>';
                    return;
                }
                container.innerHTML = `<table class="table table-hover"><thead><tr><th>Loại</th><th>Nội dung</th><th>Hành động</th><th>Thời gian</th></tr></thead><tbody>
                    ${data.map(item => `<tr>
                        <td>${item.type === 'post' ? 'Bài viết' : 'Bình luận'}</td>
                        <td>${item.titleOrContent}</td>
                        <td>${item.action}</td>
                        <td>${formatDate(item.createdAt)}</td>
                    </tr>`).join('')}
                </tbody></table>`;
            } catch (e) {
                container.innerHTML = '<p class="text-muted">Chưa có tương tác.</p>';
            }
        }

        // ---- Reports ----
        async function loadReports() {
            const container = document.getElementById('reportList');
            try {
                const reports = await callApi('GET', '/reports');
                if (!reports || reports.length === 0) {
                    container.innerHTML = '<p class="text-muted">Chưa có báo cáo nào.</p>';
                    return;
                }
                container.innerHTML = `<table class="table table-hover">
                    <thead><tr><th>ID</th><th>Người báo cáo</th><th>Nội dung</th><th>Lý do</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
                    <tbody>
                    ${reports.map(r => `
                        <tr>
                            <td>${r.reportId}</td>
                            <td>${r.reporterName}</td>
                            <td>
                                ${r.postTitle ? `<a href="post-detail.html?id=${r.postId}">${r.postTitle}</a>` : ''}
                                ${r.commentContent ? `Bình luận: "${r.commentContent}" - ${r.commentAuthor}` : ''}
                            </td>
                            <td>${r.reason}</td>
                            <td>${getStatusBadge(r.status)}</td>
                            <td>
                                ${r.commentId ? `
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteCommentFromReport(${r.commentId})">Xóa bình luận</button>
                                    <button class="btn btn-sm btn-outline-success" onclick="restoreCommentFromReport(${r.commentId})">Khôi phục</button>
                                ` : ''}
                                <button class="btn btn-sm btn-outline-secondary" onclick="resolveReport(${r.reportId})">Đã xử lý</button>
                            </td>
                        </tr>
                    `).join('')}
                    </tbody></table>`;
            } catch (e) {
                container.innerHTML = '<p class="text-muted">Chưa có báo cáo nào.</p>';
            }
        }

        async function deleteCommentFromReport(commentId) {
            if (!confirm('Xóa bình luận này (ẩn khỏi mọi người)?')) return;
            try {
                const result = await callApi('POST', '/comments', { action: 'delete', id: commentId });
                if (result.success) {
                    showToast('Đã xóa bình luận', 'success');
                    loadReports();
                } else {
                    showToast(result.message || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        async function restoreCommentFromReport(commentId) {
            if (!confirm('Khôi phục bình luận này?')) return;
            try {
                const result = await callApi('POST', '/comments/restore', { commentId });
                if (result.success) {
                    showToast('Đã khôi phục bình luận', 'success');
                    loadReports();
                } else {
                    showToast(result.message || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        async function resolveReport(reportId) {
            if (!confirm('Đánh dấu báo cáo này đã xử lý?')) return;
            try {
                const result = await callApi('POST', '/reports/update', { reportId, status: 'RESOLVED' });
                if (result.success) {
                    showToast('Đã cập nhật trạng thái', 'success');
                    loadReports();
                } else {
                    showToast(result.message || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        // ===== SUPPORT (User) =====
        async function submitSupport(e) {
            e.preventDefault();
            const message = document.getElementById('supportMessage').value.trim();
            if (!message) {
                showToast('Vui lòng nhập nội dung', 'danger');
                return;
            }
            try {
                const result = await callApi('POST', '/support', { message });
                if (result.success) {
                    showToast('✅ Đã gửi tin nhắn hỗ trợ', 'success');
                    document.getElementById('supportMessage').value = '';
                    document.getElementById('supportStatus').innerHTML = `
                        <div class="alert alert-success">Tin nhắn của bạn đã được gửi. Admin/Mod sẽ phản hồi sớm nhất.</div>
                    `;
                } else {
                    showToast(result.message || 'Lỗi gửi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        // ===== SUPPORT MESSAGES (Admin/Mod) =====
        async function loadSupportMessages() {
            const container = document.getElementById('supportMessageList');
            try {
                const messages = await callApi('GET', '/support/messages');
                if (!messages || messages.length === 0) {
                    container.innerHTML = '<p class="text-muted">Chưa có tin nhắn hỗ trợ nào.</p>';
                    return;
                }
                container.innerHTML = `<table class="table table-hover">
                    <thead><tr><th>ID</th><th>Người gửi</th><th>Nội dung</th><th>Trạng thái</th><th>Ngày gửi</th><th>Hành động</th></tr></thead>
                    <tbody>
                    ${messages.map(m => `
                        <tr>
                            <td>${m.reportId}</td>
                            <td>${m.reporterName}</td>
                            <td>${m.reason.replace('Hỗ trợ:', '')}</td>
                            <td>${getStatusBadge(m.status)}</td>
                            <td>${formatDate(m.createdAt)}</td>
                            <td>
                                ${m.status !== 'RESOLVED' ? `
                                    <button class="btn btn-sm btn-success" onclick="resolveSupport(${m.reportId})">Đã xử lý</button>
                                ` : ''}
                            </td>
                        </tr>
                    `).join('')}
                    </tbody></table>`;
            } catch (e) {
                container.innerHTML = '<p class="text-danger">Lỗi tải dữ liệu</p>';
            }
        }

        async function resolveSupport(reportId) {
            if (!confirm('Đánh dấu tin nhắn này đã xử lý?')) return;
            try {
                const result = await callApi('POST', '/support/resolve', { reportId });
                if (result.success) {
                    showToast('Đã đánh dấu đã xử lý', 'success');
                    loadSupportMessages();
                } else {
                    showToast(result.message || 'Lỗi', 'danger');
                }
            } catch (e) {
                showToast('Lỗi kết nối', 'danger');
            }
        }

        // ---- Logout ----
        async function logout() {
            await callApi('POST', '/logout');
            window.location.href = 'login.html';
        }

        // ---- Init ----
        document.addEventListener('DOMContentLoaded', function () {
            loadTheme();
            applyGlobalSettings();
            checkLogin();
        });
    </script>
</body>

</html>
