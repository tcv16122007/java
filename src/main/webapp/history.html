<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Lịch sử đọc - Blog SE
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/app.css?v=20260806" rel="stylesheet" />
    <link href="css/pages/history.css?v=20260806" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-pencil-square">
                </i>
                Blog SE
            </a>
            <div class="navbar-actions ms-auto" data-navbar-actions="">
                <img alt="Ảnh đại diện" class="nav-user-avatar d-none" data-user-avatar="" />
                <span class="text-white nav-user-name d-none" data-user-name="">
                </span>
                <button class="btn btn-outline-light theme-toggle" data-action="toggle-theme" type="button">
                    <i class="bi bi-moon-stars">
                    </i>
                </button>
                <a class="btn btn-outline-light" href="dashboard.html">
                    Dashboard
                </a>
                <button class="btn btn-danger" data-action="logout" type="button">
                    Đăng xuất
                </button>
            </div>
        </div>
    </nav>
    <main class="container py-5 main-content">
        <div class="history-toolbar mb-4">
            <div>
                <p class="text-uppercase small fw-semibold text-primary mb-1">
                    Cá nhân
                </p>
                <h1 class="h2 fw-bold mb-0">
                    Lịch sử đọc
                </h1>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <input class="form-control history-search" id="historySearch" placeholder="Tìm trong lịch sử..."
                    type="search" />
                <select class="form-select history-sort" id="historySort">
                    <option value="recent">
                        Gần đây
                    </option>
                    <option value="oldest">
                        Cũ nhất
                    </option>
                    <option value="title">
                        Tên A-Z
                    </option>
                </select>
            </div>
        </div>
        <div class="d-grid gap-3" id="historyList">
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/app.js?v=20260816-account-status">
    </script>
    <script src="js/history.js?v=20260808-role-separation">
    </script>
</body>

</html>
