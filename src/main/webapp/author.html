<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="Hồ sơ tác giả Blog SE" name="description" />
    <title>
        Tác giả - Blog SE
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/app.css?v=20260806" rel="stylesheet" />
    <link href="css/pages/author.css?v=20260806" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-pencil-square">
                </i>
                Blog SE
            </a>
            <button class="navbar-toggler" data-bs-target="#authorNav" data-bs-toggle="collapse" type="button">
                <span class="navbar-toggler-icon">
                </span>
            </button>
            <div class="collapse navbar-collapse" id="authorNav">
                <div class="navbar-actions ms-auto" data-navbar-actions="">
                    <img alt="Ảnh đại diện" class="nav-user-avatar d-none" data-user-avatar="" />
                    <span class="text-white nav-user-name d-none" data-user-name="">
                    </span>
                    <button class="btn btn-outline-light theme-toggle" data-action="toggle-theme" type="button">
                        <i class="bi bi-moon-stars">
                        </i>
                    </button>
                    <a class="btn btn-outline-light" data-auth="guest" href="login.html">
                        Đăng nhập
                    </a>
                    <a class="btn btn-outline-light d-none" data-auth="user" href="dashboard.html">
                        Dashboard
                    </a>
                    <button class="btn btn-danger d-none" data-action="logout" data-auth="user" type="button">
                        Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <main class="container py-5 main-content">
        <div id="authorState">
        </div>
        <section class="d-none" id="authorContent">
            <div class="author-hero app-card">
                <img alt="Ảnh tác giả" class="author-avatar" id="authorAvatar" />
                <div>
                    <span class="eyebrow">
                        Hồ sơ tác giả
                    </span>
                    <h1 class="display-6 fw-bold mb-1" id="authorName">
                    </h1>
                    <p class="text-muted mb-3" id="authorUsername">
                    </p>
                    <div class="author-stats" id="authorStats">
                    </div>
                </div>
                <button class="btn btn-outline-primary ms-lg-auto" id="shareAuthorButton" type="button">
                    <i class="bi bi-share">
                    </i>
                    Chia sẻ
                </button>
            </div>
            <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mt-5 mb-3">
                <div>
                    <p class="text-uppercase small fw-semibold text-primary mb-1">
                        Bài viết
                    </p>
                    <h2 class="h3 mb-0">
                        Nội dung đã xuất bản
                    </h2>
                </div>
                <select class="form-select author-sort" id="authorSort">
                    <option value="newest">
                        Mới nhất
                    </option>
                    <option value="most_viewed">
                        Xem nhiều
                    </option>
                    <option value="most_liked">
                        Thích nhiều
                    </option>
                </select>
            </div>
            <div class="row g-4" id="authorPosts">
            </div>
            <nav class="d-flex justify-content-center mt-4" id="authorPagination">
            </nav>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/app.js?v=20260816-account-status">
    </script>
    <script src="js/author.js?v=20260807-2208">
    </script>
</body>

</html>
