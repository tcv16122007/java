<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết bài viết - Blog SE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-pencil-square"></i> Blog SE</a>
            <div class="d-flex align-items-center">
                <img id="avatarImg" src="https://ui-avatars.com/api/?name=User&background=667eea&color=fff&size=32"
                    class="rounded-circle me-2" style="width:32px;height:32px;object-fit:cover;display:none;">
                <span id="userInfo" class="text-white me-2 d-none"></span>
                <button class="btn btn-outline-light btn-sm me-2" onclick="toggleTheme()"><i
                        class="bi bi-moon-stars"></i></button>
                <a href="#" id="loginBtn" class="btn btn-outline-light me-2"
                    onclick="window.location.href='login.html'">Đăng nhập</a>
                <a href="#" id="logoutBtn" class="btn btn-danger d-none" onclick="logout()">Đăng xuất</a>
                <a href="dashboard.html" id="dashboardBtn" class="btn btn-light ms-2 d-none">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="postContent">
            <div class="text-center text-muted py-5">Đang tải bài viết...</div>
        </div>
    </div>

    <!-- Modal Báo cáo -->
    <div class="modal fade" id="reportModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Báo cáo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reportForm">
                        <input type="hidden" id="reportTarget" value="post">
                        <input type="hidden" id="reportTargetId" value="">
                        <div class="mb-3">
                            <label class="form-label">Lý do báo cáo</label>
                            <textarea id="reportReason" class="form-control" rows="3" placeholder="Nhập lý do..."
                                required></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger">Gửi báo cáo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Sửa bài viết -->
    <div class="modal fade" id="editPostModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Sửa bài viết</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editPostForm">
                        <input type="hidden" id="editPostId">
                        <div class="mb-2">
                            <label class="form-label">Tiêu đề</label>
                            <input type="text" id="editTitle" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Tóm tắt</label>
                            <input type="text" id="editSummary" class="form-control">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Danh mục</label>
                            <select id="editCategory" class="form-select"></select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Nội dung</label>
                            <textarea id="editContent" class="form-control" rows="6" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentUser = null;
        let currentPostId = null;
        let currentPost = null;

        function getPostId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function checkLogin() {
            try {
                const res = await callApi('GET', '/current-user');
                if (res.success) {
                    currentUser = res.user;
                    updateUI(currentUser);
                } else {
                    updateUI(null);
                }
            } catch (e) { updateUI(null); }
        }

        function renderContent(content) {
            if (!content) return '';
            let html = content;
            html = html.replace(
                /(?:https?:\/\/)?(?:www\.)?(?:youtu\.be\/|youtube\.com\/watch\?v=)([\w-]+)(?:&[^\s]+)?/g,
                (match, id) => {
                    const cleanId = id.split('&')[0];
                    return `<div class="media-container"><iframe src="https://www.youtube.com/embed/${cleanId}" allowfullscreen></iframe></div>`;
                }
            );
            html = html.replace(
                /(https?:\/\/[^\s]+\.(?:jpg|jpeg|png|gif|webp))/gi,
                (match) => `<div class="media-container"><img src="${match}" alt="image" loading="lazy"></div>`
            );
            html = html.replace(
                /(https?:\/\/[^\s]+\.(?:mp4|webm))/gi,
                (match) => `<div class="media-container"><video controls><source src="${match}" type="video/mp4"></video></div>`
            );
            html = html.replace(
                /(https?:\/\/[^\s<]+)(?![^<]*>)/g,
                (match) => `<a href="${match}" target="_blank" rel="noopener">${match}</a>`
            );
            return html;
        }

        async function loadPost() {
            const id = getPostId();
            if (!id) {
                document.getElementById('postContent').innerHTML = '<div class="alert alert-danger">Không tìm thấy bài viết</div>';
                return;
            }
            currentPostId = id;
            const result = await callApi('GET', `/posts?action=detail&id=${id}`);
            if (result.error) {
                document.getElementById('postContent').innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
                return;
            }
            currentPost = result;

            if (currentUser && result.status === 'APPROVED') {
                try {
                    await callApi('POST', '/view-history', { postId: id });
                } catch (e) { console.warn('View history error:', e); }
            }

            const isMod = currentUser && (currentUser.role === 'MODERATOR' || currentUser.role === 'ADMIN');
            const isAuthor = currentUser && currentUser.userId === result.authorId;
            const canView = result.status === 'APPROVED' || (isMod && result.status !== 'DELETED') || isAuthor;
            if (!canView) {
                document.getElementById('postContent').innerHTML = `
                    <div class="alert alert-warning">Bạn không có quyền xem bài viết này.</div>
                `;
                return;
            }

            const renderedContent = renderContent(result.content);

            let actionButtons = '';
            if (isAuthor) {
                actionButtons += `
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditPost()"><i class="bi bi-pencil"></i> Sửa</button>
                    <button class="btn btn-sm btn-outline-danger me-1" onclick="deletePost()"><i class="bi bi-trash"></i> Xóa</button>
                `;
            }
            if (isMod) {
                actionButtons += `
                    <button class="btn btn-sm btn-outline-danger me-1" onclick="deletePost()"><i class="bi bi-trash"></i> Xóa</button>
                `;
                if (result.status === 'DELETED') {
                    actionButtons += `
                        <button class="btn btn-sm btn-outline-success" onclick="restorePost()"><i class="bi bi-arrow-counterclockwise"></i> Khôi phục</button>
                    `;
                }
            }
            if (currentUser && !isAuthor) {
                actionButtons += `
                    <button class="btn btn-sm btn-outline-danger me-1" onclick="openReport('post', ${result.postId})"><i class="bi bi-flag"></i> Báo cáo</button>
                `;
            }

            let bookmarkHTML = '';
            if (currentUser) {
                try {
                    const bmRes = await callApi('GET', `/bookmarks?postId=${currentPostId}`);
                    const isBookmarked = bmRes.bookmarked || false;
                    bookmarkHTML = `
                        <button class="btn btn-sm btn-outline-primary" onclick="toggleBookmark()">
                            <i class="bi ${isBookmarked ? 'bi-bookmark-fill' : 'bi-bookmark'}"></i>
                            <span id="bookmarkText">${isBookmarked ? 'Đã lưu' : 'Lưu'}</span>
                        </button>
                    `;
                } catch (e) {
                    bookmarkHTML = `
                        <button class="btn btn-sm btn-outline-primary" onclick="toggleBookmark()">
                            <i class="bi bi-bookmark"></i> <span id="bookmarkText">Lưu</span>
                        </button>
                    `;
                }
            }

            document.getElementById('postContent').innerHTML = `
                <div class="card p-4">
                    <h2 class="fw-bold">${result.title}</h2>
                    <div class="text-muted small mb-3">
                        <i class="bi bi-person"></i> ${result.authorName} |
                        <i class="bi bi-calendar"></i> ${formatDate(result.createdAt)} |
                        <span class="badge ${result.status === 'APPROVED' ? 'bg-success' : 'bg-warning'}">${result.status}</span>
                        ${actionButtons ? `<br><span class="mt-2 d-inline-block">${actionButtons}</span>` : ''}
                    </div>
                    <div class="mb-4">${renderedContent}</div>
                    <div class="mb-3">
                        <button class="btn btn-outline-danger like-btn" onclick="toggleLike()">
                            <i class="bi bi-heart-fill"></i> Thích <span id="likeCount">${result.likeCount || 0}</span>
                        </button>
                        ${bookmarkHTML}
                    </div>
                    <hr>
                    <h6>💬 Bình luận <span class="comment-count">(${result.commentCount || 0})</span></h6>
                    <div id="commentList" class="mb-3"></div>
                    <div id="commentFormContainer" class="${currentUser ? '' : 'd-none'}">
                        <form id="commentForm" class="d-flex gap-2">
                            <input type="text" id="commentInput" class="form-control" placeholder="Viết bình luận..." required>
                            <button class="btn btn-primary" type="submit">Gửi</button>
                        </form>
                    </div>
                    <div id="commentLoginMsg" class="text-muted small ${currentUser ? 'd-none' : ''}">
                        <a href="login.html">Đăng nhập</a> để bình luận
                    </div>
                </div>
            `;

            await loadComments(id);

            const form = document.getElementById('commentForm');
            if (form) {
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    if (!currentUser) {
                        showToast('Vui lòng đăng nhập', 'warning');
                        return;
                    }
                    const content = document.getElementById('commentInput').value.trim();
                    if (!content) return;
                    const result = await callApi('POST', '/comments', {
                        action: 'add',
                        content: content,
                        postId: id
                    });
                    if (result.success) {
                        document.getElementById('commentInput').value = '';
                        await loadComments(id);
                        showToast('Đã bình luận', 'success');
                    } else {
                        showToast(result.message || 'Lỗi', 'danger');
                    }
                });
            }
        }

        async function loadComments(postId) {
            const comments = await callApi('GET', `/comments?postId=${postId}`);
            const container = document.getElementById('commentList');
            if (!container) return;
            if (!comments || comments.length === 0) {
                container.innerHTML = '<p class="text-muted">Chưa có bình luận.</p>';
                return;
            }
            container.innerHTML = comments.map(c => renderCommentTree(c)).join('');
        }

        function renderCommentTree(comment, level = 0) {
            const indent = level > 0 ? 'comment-reply' : '';
            const isMod = currentUser && (currentUser.role === 'MODERATOR' || currentUser.role === 'ADMIN');
            const isOwner = currentUser && currentUser.userId === comment.userId;
            const likeCount = comment.likeCount || 0;

            let html = `
                <div class="comment-box ${indent}" id="comment-${comment.commentId}">
                    <div class="d-flex justify-content-between">
                        <strong><i class="bi bi-person-circle"></i> ${comment.username || 'Anonymous'}</strong>
                        <small class="text-muted">${formatDate(comment.createdAt)}</small>
                    </div>
                    <p class="mb-1">${comment.content}</p>
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        ${currentUser ? `
                            <button class="btn btn-sm btn-outline-primary like-btn" onclick="toggleCommentLike(${comment.commentId})">
                                <i class="bi ${comment.likedByCurrentUser ? 'bi-heart-fill text-danger' : 'bi-heart'}"></i> <span id="comment-like-${comment.commentId}">${likeCount}</span>
                            </button>
                            <button class="btn btn-sm btn-outline-info" onclick="showReplyForm(${comment.commentId})">
                                <i class="bi bi-reply"></i> Trả lời
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="openReport('comment', ${comment.commentId})">
                                <i class="bi bi-flag"></i> Báo cáo
                            </button>
                        ` : ''}
                        ${isOwner && comment.status === 'VISIBLE' ? `
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteMyComment(${comment.commentId})"><i class="bi bi-trash"></i> Xóa</button>
                        ` : ''}
                        ${isMod && comment.status === 'DELETED' ? `
                            <button class="btn btn-sm btn-outline-success" onclick="restoreComment(${comment.commentId})"><i class="bi bi-arrow-counterclockwise"></i> Khôi phục</button>
                        ` : ''}
                        ${isMod && comment.status === 'VISIBLE' ? `
                            <button class="btn btn-sm btn-outline-warning" onclick="toggleCommentAdmin(${comment.commentId})">Ẩn</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteCommentAdmin(${comment.commentId})">Xóa</button>
                        ` : ''}
                        ${isMod && comment.status === 'HIDDEN' ? `
                            <button class="btn btn-sm btn-outline-success" onclick="toggleCommentAdmin(${comment.commentId})">Hiện</button>
                        ` : ''}
                    </div>
                    <div id="reply-form-${comment.commentId}" style="display:none;" class="mt-2">
                        <form class="d-flex gap-2" onsubmit="submitReply(event, ${comment.commentId})">
                            <input type="text" class="form-control form-control-sm" placeholder="Nhập trả lời..." required>
                            <button class="btn btn-sm btn-primary" type="submit">Gửi</button>
                            <button class="btn btn-sm btn-secondary" type="button" onclick="hideReplyForm(${comment.commentId})">Hủy</button>
                        </form>
                    </div>
                    ${comment.replies && comment.replies.length > 0 ?
                    comment.replies.map(r => renderCommentTree(r, level + 1)).join('') :
                    ''}
                </div>
            `;
            return html;
        }

        function showReplyForm(commentId) {
            const el = document.getElementById('reply-form-' + commentId);
            if (el) el.style.display = 'block';
        }

        function hideReplyForm(commentId) {
            const el = document.getElementById('reply-form-' + commentId);
            if (el) el.style.display = 'none';
        }

        async function submitReply(event, parentId) {
            event.preventDefault();
            if (!currentUser) { showToast('Vui lòng đăng nhập', 'warning'); return; }
            const form = event.target;
            const input = form.querySelector('input');
            const content = input.value.trim();
            if (!content) return;
            const result = await callApi('POST', '/comments', {
                action: 'add',
                content: content,
                postId: currentPostId,
                parentId: parentId
            });
            if (result.success) {
                input.value = '';
                hideReplyForm(parentId);
                await loadComments(currentPostId);
                showToast('Đã trả lời', 'success');
            } else {
                showToast(result.message || 'Lỗi', 'danger');
            }
        }

        async function toggleCommentLike(commentId) {
            if (!currentUser) { showToast('Vui lòng đăng nhập', 'warning'); return; }
            const result = await callApi('POST', '/comment/like', { id: commentId });
            if (result.success) {
                document.getElementById('comment-like-' + commentId).textContent = result.likeCount || 0;
                const btn = document.querySelector(`#comment-${commentId} .btn-outline-primary i`);
                if (btn) btn.className = 'bi bi-heart-fill text-danger';
                showToast('Đã thích', 'success');
            } else {
                showToast(result.message || 'Lỗi', 'danger');
            }
        }

        async function toggleLike() {
            if (!currentUser) {
                showToast('Vui lòng đăng nhập', 'warning');
                return;
            }
            const result = await callApi('POST', '/like', { id: currentPostId });
            if (result.success) {
                document.getElementById('likeCount').textContent = result.likeCount || 0;
                showToast('Đã thích bài viết', 'success');
            } else {
                const unlikeResult = await callApi('POST', '/unlike', { id: currentPostId });
                if (unlikeResult.success) {
                    document.getElementById('likeCount').textContent = unlikeResult.likeCount || 0;
                    showToast('Đã bỏ thích', 'info');
                }
            }
        }

        async function toggleBookmark() {
            if (!currentUser) {
                showToast('Vui lòng đăng nhập', 'warning');
                return;
            }
            const result = await callApi('POST', '/bookmark/toggle', { postId: currentPostId });
            if (result.success) {
                const icon = document.querySelector('#bookmarkText');
                if (result.bookmarked) {
                    document.querySelector('.btn-outline-primary i').className = 'bi bi-bookmark-fill';
                    icon.textContent = 'Đã lưu';
                } else {
                    document.querySelector('.btn-outline-primary i').className = 'bi bi-bookmark';
                    icon.textContent = 'Lưu';
                }
                showToast(result.message, 'success');
            } else {
                showToast(result.message || 'Lỗi', 'danger');
            }
        }

        // ---- Xóa bài viết ----
        async function deletePost() {
            if (!confirm('Bạn có chắc muốn xóa bài viết này?')) return;
            const result = await callApi('POST', '/posts', { action: 'delete', id: currentPostId });
            if (result.success) {
                showToast('Đã xóa bài viết', 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } else {
                showToast(result.message || 'Lỗi xóa bài', 'danger');
            }
        }

        // ---- Khôi phục bài viết ----
        async function restorePost() {
            if (!confirm('Khôi phục bài viết này?')) return;
            const result = await callApi('POST', '/posts/restore', { postId: currentPostId });
            if (result.success) {
                showToast('Đã khôi phục bài viết', 'success');
                window.location.reload();
            } else {
                showToast(result.message || 'Lỗi khôi phục', 'danger');
            }
        }

        // ---- Báo cáo ----
        function openReport(target, targetId) {
            document.getElementById('reportTarget').value = target;
            document.getElementById('reportTargetId').value = targetId;
            const modal = new bootstrap.Modal(document.getElementById('reportModal'));
            modal.show();
        }

        document.getElementById('reportForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const target = document.getElementById('reportTarget').value;
            const targetId = document.getElementById('reportTargetId').value;
            const reason = document.getElementById('reportReason').value.trim();
            if (!reason) {
                showToast('Vui lòng nhập lý do', 'danger');
                return;
            }
            let url = target === 'post' ? '/posts/report' : '/comments/report';
            const data = target === 'post' ? { postId: targetId, reason } : { commentId: targetId, reason };
            const result = await callApi('POST', url, data);
            if (result.success) {
                showToast('Đã gửi báo cáo', 'success');
                bootstrap.Modal.getInstance(document.getElementById('reportModal')).hide();
                document.getElementById('reportReason').value = '';
            } else {
                showToast(result.message || 'Lỗi gửi báo cáo', 'danger');
            }
        });

        // ---- Sửa bài viết ----
        async function openEditPost() {
            if (!currentPost) return;
            document.getElementById('editPostId').value = currentPost.postId;
            document.getElementById('editTitle').value = currentPost.title;
            document.getElementById('editSummary').value = currentPost.summary || '';
            document.getElementById('editContent').value = currentPost.content;
            const cats = await callApi('GET', '/categories');
            const sel = document.getElementById('editCategory');
            if (cats) {
                sel.innerHTML = cats.map(c =>
                    `<option value="${c.categoryId}" ${c.categoryId == currentPost.categoryId ? 'selected' : ''}>${c.categoryName}</option>`
                ).join('');
            }
            const modal = new bootstrap.Modal(document.getElementById('editPostModal'));
            modal.show();
        }

        document.getElementById('editPostForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const postId = document.getElementById('editPostId').value;
            const title = document.getElementById('editTitle').value.trim();
            const content = document.getElementById('editContent').value.trim();
            const summary = document.getElementById('editSummary').value.trim();
            const categoryId = document.getElementById('editCategory').value;
            if (!title || !content) {
                showToast('Vui lòng nhập đủ tiêu đề và nội dung', 'danger');
                return;
            }
            const data = { postId, title, content, summary, categoryId };
            const result = await callApi('POST', '/posts/update', data);
            if (result.success) {
                showToast('Cập nhật thành công', 'success');
                bootstrap.Modal.getInstance(document.getElementById('editPostModal')).hide();
                window.location.reload();
            } else {
                showToast(result.message || 'Lỗi cập nhật', 'danger');
            }
        });

        // ---- Xóa bình luận của chính mình ----
        async function deleteMyComment(commentId) {
            if (!confirm('Xóa bình luận của bạn?')) return;
            const result = await callApi('POST', '/comments/delete-by-user', { commentId });
            if (result.success) {
                showToast('Đã xóa bình luận', 'success');
                await loadComments(currentPostId);
            } else {
                showToast(result.message || 'Lỗi', 'danger');
            }
        }

        // ---- Khôi phục bình luận (Mod/Admin) ----
        async function restoreComment(commentId) {
            if (!confirm('Khôi phục bình luận này?')) return;
            const result = await callApi('POST', '/comments/restore', { commentId });
            if (result.success) {
                showToast('Đã khôi phục', 'success');
                await loadComments(currentPostId);
            } else {
                showToast(result.message || 'Lỗi', 'danger');
            }
        }

        // ---- Mod/Admin toggle comment status ----
        async function toggleCommentAdmin(commentId) {
            const result = await callApi('POST', '/comments', { action: 'toggle', id: commentId });
            if (result.success) {
                showToast('Đã cập nhật', 'success');
                await loadComments(currentPostId);
            } else {
                showToast(result.message || 'Lỗi', 'danger');
            }
        }

        async function deleteCommentAdmin(commentId) {
            if (!confirm('Xóa bình luận này?')) return;
            const result = await callApi('POST', '/comments', { action: 'delete', id: commentId });
            if (result.success) {
                showToast('Đã xóa', 'success');
                await loadComments(currentPostId);
            } else {
                showToast(result.message || 'Lỗi', 'danger');
            }
        }

        async function logout() {
            await callApi('POST', '/logout');
            currentUser = null;
            updateUI(null);
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadTheme();
            applyGlobalSettings();
            checkLogin().then(() => loadPost());
        });
    </script>
</body>

</html>
