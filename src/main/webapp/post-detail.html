<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết bài viết - Blog SE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/app.css?v=20260806" rel="stylesheet">
    <link href="css/pages/post-detail.css?v=20260806" rel="stylesheet">
</head>

<body>
    <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-pencil-square"></i> Blog SE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#detailNavbar"
                aria-label="Mở menu"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="detailNavbar">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link d-none" data-auth="user" data-role="USER"
                            href="history.html">Đã xem</a></li>
                </ul>
                <div class="navbar-actions" data-navbar-actions>
                    <img class="nav-user-avatar d-none" data-user-avatar alt="Ảnh đại diện">
                    <span class="text-white nav-user-name d-none" data-user-name></span>
                    <button class="btn btn-outline-light theme-toggle" type="button" data-action="toggle-theme"
                        aria-label="Đổi giao diện"><i class="bi bi-moon-stars"></i></button>
                    <a class="btn btn-outline-light" data-auth="guest" href="login.html">Đăng nhập</a>
                    <a class="btn btn-light d-none" data-auth="user" href="dashboard.html">Dashboard</a>
                    <button class="btn btn-danger d-none" data-auth="user" data-action="logout" type="button">Đăng
                        xuất</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content container py-4 py-lg-5" id="postPage">
        <div id="postContent"> </div>
        <section class="mt-5" id="relatedSection" aria-labelledby="relatedHeading">
            <div class="section-heading">
                <div>
                    <p class="text-uppercase small fw-semibold text-primary mb-1">Tiếp tục khám phá</p>
                    <h2 class="h3 mb-0" id="relatedHeading">Bài viết liên quan</h2>
                </div>
            </div>
            <div class="row g-4" id="relatedPosts"></div>
        </section>
    </main>

    <button class="back-to-top d-none" id="backToTop" type="button" aria-label="Quay lại đầu trang"><i
            class="bi bi-arrow-up"></i></button>

    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="reportForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Báo cáo nội dung</h5><button class="btn-close" type="button"
                            data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body"><input type="hidden" id="reportTarget" value="post"><input type="hidden"
                            id="reportTargetId"><label class="form-label" for="reportReason">Lý do báo
                            cáo</label><textarea class="form-control" id="reportReason" rows="5" maxlength="255"
                            required></textarea>
                        <div class="char-count"><span id="reportCount">0</span>/255</div>
                    </div>
                    <div class="modal-footer"><button class="btn btn-secondary" type="button"
                            data-bs-dismiss="modal">Hủy</button><button class="btn btn-danger" type="submit">Gửi báo
                            cáo</button></div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editPostModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <form id="editPostForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Chỉnh sửa bài viết</h5><button class="btn-close" type="button"
                            data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body"><input type="hidden" id="editPostId">
                        <div class="row g-4">
                            <div class="col-lg-8">
                                <div class="mb-3"><label class="form-label" for="editTitle">Tiêu đề</label><input
                                        class="form-control" id="editTitle" maxlength="255" required></div>
                                <div class="mb-3"><label class="form-label" for="editSummary">Tóm tắt</label><textarea
                                        class="form-control" id="editSummary" rows="3" maxlength="500"></textarea></div>
                                <label class="form-label" for="editContent">Nội dung Markdown</label>
                                <div class="editor-toolbar" data-editor-target="editContent"><button
                                        class="btn btn-sm btn-outline-secondary" type="button"
                                        data-editor-command="heading"><i class="bi bi-type-h2"></i></button><button
                                        class="btn btn-sm btn-outline-secondary" type="button"
                                        data-editor-command="bold"><i class="bi bi-type-bold"></i></button><button
                                        class="btn btn-sm btn-outline-secondary" type="button"
                                        data-editor-command="italic"><i class="bi bi-type-italic"></i></button><button
                                        class="btn btn-sm btn-outline-secondary" type="button"
                                        data-editor-command="code"><i class="bi bi-code-slash"></i></button><button
                                        class="btn btn-sm btn-outline-secondary" type="button"
                                        data-editor-command="list"><i class="bi bi-list-ul"></i></button></div><textarea
                                    class="form-control editor-textarea" id="editContent" maxlength="100000"
                                    required></textarea>
                            </div>
                            <div class="col-lg-4">
                                <div class="app-card p-3 mb-3"><label class="form-label" for="editCategory">Danh
                                        mục</label><select class="form-select" id="editCategory" required></select>
                                </div>
                                <div class="app-card p-3 mb-3">
                                    <label class="form-label" for="editThumbnailFile">Ảnh thumbnail</label>
                                    <input type="hidden" id="editThumbnail">
                                    <input class="form-control" id="editThumbnailFile" type="file"
                                        accept="image/jpeg,image/png,image/webp">
                                    <div class="form-text">JPG, PNG hoặc WebP, tối đa 5 MB.</div>
                                    <div class="thumbnail-upload-status small mt-2" id="editThumbnailStatus"
                                        aria-live="polite"></div>
                                    <div class="mt-3" id="editThumbnailPreview"></div>
                                    <button class="btn btn-sm btn-outline-danger mt-2 d-none" id="editThumbnailRemove"
                                        type="button"><i class="bi bi-trash"></i> Xóa ảnh</button>
                                </div>
                                <div class="app-card p-3">
                                    <div class="form-label">Thẻ bài viết</div>
                                    <div class="tag-picker" id="editTagPicker"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer"><button class="btn btn-secondary" type="button"
                            data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" type="submit">Cập
                            nhật</button></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=20260816-account-status"></script>
    <script src="js/post-detail.js?v=20260808-viewonly-roles"></script>
</body>

</html>
